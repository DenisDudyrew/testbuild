name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout → код
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum

      - name: Test Go API against PostgreSQL in memory
        run: go -C backend test -race ./...

      - name: Run unit & integration tests
        run: npm test
        env:
          ENCRYPTION_KEY: test-key-for-ci-only
          AUTH_SECRET: test-auth-secret-for-ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: Check real frontend with Go API and in-memory PostgreSQL
        run: ZEPHYR_BROWSER_CHECK=1 go -C backend test -run TestBrowserAgainstGo -v ./internal/server

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout → код
        uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}:latest
            ghcr.io/${{ steps.repo.outputs.repo }}:${{ github.sha }}

  deploy:
    needs: [test, build-and-push]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout → код
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Copy files and restart containers
        run: |
          mkdir -p /opt/testbuild
          cp docker-compose.prod.yml /opt/testbuild/docker-compose.prod.yml
          cd /opt/testbuild
          export IMAGE_TAG="${{ github.sha }}"
          docker compose -f docker-compose.prod.yml pull app
          docker compose -f docker-compose.prod.yml up -d --no-deps app
          container_id=$(docker compose -f docker-compose.prod.yml ps -q app)
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$container_id")
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then docker compose -f docker-compose.prod.yml logs --tail=80 app; exit 1; fi
            sleep 3
          done
          docker compose -f docker-compose.prod.yml logs --tail=80 app
          exit 1

